<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="amberJuice" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="crystalCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Heavy Crystal Cap -->
  <polygon points="120,40 180,40 190,95 110,95" fill="url(#crystalCap)" stroke="#fef08a" stroke-width="1"/>
  <rect x="130" y="95" width="40" height="20" fill="#a16207"/>

  <!-- Flacon Cut Glass Body -->
  <rect x="70" y="115" width="160" height="250" rx="12" fill="url(#amberJuice)" stroke="#fef3c7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Cut-Glass Vertical Ribs -->
  <line x1="95" y1="125" x2="95" y2="355" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  <line x1="120" y1="125" x2="120" y2="355" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  <line x1="180" y1="125" x2="180" y2="355" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  <line x1="205" y1="125" x2="205" y2="355" stroke="#ffffff" stroke-width="2" opacity="0.25"/>

  <!-- Diamond Plaque -->
  <rect x="95" y="195" width="110" height="90" rx="4" fill="#18181b" stroke="#fef08a" stroke-width="1.5"/>
  <text x="150" y="235" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">NICHE</text>
  <text x="150" y="255" font-family="'Inter', sans-serif" font-size="8" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">AMBER INTENSE</text>
  <text x="150" y="272" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">100 ML</text>
</svg>
