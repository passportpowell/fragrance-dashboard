<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#475569" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="perfumeJuice" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="150" cy="220" r="110" fill="#eab308" opacity="0.08" filter="url(#glow)"/>

  <!-- Bottle Cap -->
  <rect x="115" y="45" width="70" height="50" rx="6" fill="url(#goldCap)"/>
  <rect x="122" y="95" width="56" height="15" rx="3" fill="#ca8a04"/>
  <!-- Cap Ribbing Accent -->
  <line x1="120" y1="60" x2="180" y2="60" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="75" x2="180" y2="75" stroke="#713f12" stroke-width="1.5" opacity="0.5"/>

  <!-- Sprayer Neck -->
  <rect x="135" y="110" width="30" height="20" fill="url(#goldCap)"/>

  <!-- Glass Bottle Outer Body -->
  <rect x="65" y="130" width="170" height="230" rx="24" fill="url(#glassBody)" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Liquid Chamber -->
  <rect x="75" y="145" width="150" height="205" rx="16" fill="url(#perfumeJuice)"/>

  <!-- Dip Tube -->
  <line x1="150" y1="125" x2="152" y2="340" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Luxury Minimalist Label -->
  <rect x="90" y="200" width="120" height="110" rx="8" fill="url(#labelBg)" stroke="url(#goldCap)" stroke-width="1.5"/>
  <rect x="94" y="204" width="112" height="102" rx="6" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-opacity="0.5"/>

  <text x="150" y="235" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">PERFUME</text>
  <text x="150" y="250" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">PARLOUR</text>
  <line x1="110" y1="262" x2="190" y2="262" stroke="#eab308" stroke-width="1" opacity="0.7"/>
  <text x="150" y="280" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">EXTRAIT DE PARFUM</text>
  <text x="150" y="295" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">50 ML / 1.7 FL. OZ</text>

  <!-- Glass Highlight Reflection -->
  <path d="M 75 145 Q 85 240 85 340" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none"/>
</svg>
